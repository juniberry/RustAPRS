[package]
name = "aprs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line APRS packet decoder"

[[bin]]
name = "aprs-cli"
path = "src/main.rs"

[dependencies]
aprs-core = { path = "../aprs-core" }
aprs-decoders = { path = "../aprs-decoders" }
aprs-encoders = { path = "../aprs-encoders" }
aprs-format = { path = "../aprs-format" }
clap = { version = "4", features = ["derive"] }
