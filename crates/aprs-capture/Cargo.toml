[package]
name = "aprs-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "APRS-IS bulk corpus collector"

[[bin]]
name = "aprs-capture"
path = "src/main.rs"

[dependencies]
aprs-ax25 = { path = "../aprs-ax25" }
aprs-core = { path = "../aprs-core" }
aprs-decoders = { path = "../aprs-decoders" }
aprs-format = { path = "../aprs-format" }
aprs-is = { path = "../aprs-is" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serialport = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
